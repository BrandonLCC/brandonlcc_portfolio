<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d2fe0"/>
      <stop offset="30%" stop-color="#3a5cf0"/>
      <stop offset="60%" stop-color="#22d0f0"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d0f0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#3a5cf0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="strongBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="fadedBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g transform="translate(512,512)">
    <!-- faded outer rings, same glow style as main ring, lower opacity -->
    <circle r="280" fill="none" stroke="url(#ringGrad)" stroke-width="10" filter="url(#fadedBlur)" opacity="0.16"/>
    <circle r="280" fill="none" stroke="url(#ringGrad2)" stroke-width="1.5" opacity="0.22"/>

    <circle r="255" fill="none" stroke="url(#ringGrad)" stroke-width="7" filter="url(#fadedBlur)" opacity="0.22"/>
    <circle r="255" fill="none" stroke="url(#ringGrad2)" stroke-width="1" opacity="0.3"/>

    <!-- main ring: thin, glow -->
    <circle r="230" fill="none" stroke="url(#ringGrad)" stroke-width="16" filter="url(#strongBlur)" opacity="0.75"/>
    <circle r="230" fill="none" stroke="url(#ringGrad)" stroke-width="8" filter="url(#softBlur)" opacity="0.9"/>
    <circle r="230" fill="none" stroke="url(#ringGrad2)" stroke-width="2.5"/>

    <g opacity="0.9">
      <circle r="230" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="0.1 24" stroke-linecap="round"/>
    </g>

    <g stroke="#22d0f0" stroke-width="1.3" fill="none" opacity="0.85">
      <path d="M -30 -226 A 230 230 0 0 1 30 -226"/>
      <path d="M -226 -30 A 230 230 0 0 0 -226 30"/>
      <path d="M 226 -30 A 230 230 0 0 1 226 30"/>
      <path d="M -30 226 A 230 230 0 0 0 30 226"/>
    </g>

    <circle r="230" fill="none" stroke="#8ad9ff" stroke-width="0.4" opacity="0.6"/>
  </g>
</svg>
