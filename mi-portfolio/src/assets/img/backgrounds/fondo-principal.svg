<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010111"/>
      <stop offset="100%" stop-color="#010111"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

  </defs>

  <!-- Fondo -->
  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- GRID -->
  <g stroke="#97DDF8"
     stroke-width="1"
     stroke-opacity=".25">

    <!-- Horizontales -->
    <line x1="0" y1="0" x2="180" y2="0"/>
    <line x1="0" y1="60" x2="180" y2="60"/>
    <line x1="0" y1="120" x2="180" y2="120"/>
    <line x1="0" y1="180" x2="180" y2="180"/>

    <!-- Verticales -->
    <line x1="0" y1="0" x2="0" y2="180"/>
    <line x1="60" y1="0" x2="60" y2="180"/>
    <line x1="120" y1="0" x2="120" y2="180"/>
    <line x1="180" y1="0" x2="180" y2="180"/>

  </g>

  <!-- Glow principal -->
  <g fill="#78CFFF" opacity=".20" filter="url(#glow)">
    <circle cx="60" cy="60" r="7"/>
    <circle cx="120" cy="60" r="7"/>
    <circle cx="60" cy="120" r="7"/>
    <circle cx="120" cy="120" r="7"/>
  </g>

  <!-- Nodos grandes -->
  <g fill="#A8E6FF">

    <!-- Fila 1 -->
    <circle cx="0" cy="0" r="1.8"/>
    <circle cx="60" cy="0" r="1.8"/>
    <circle cx="120" cy="0" r="1.8"/>
    <circle cx="180" cy="0" r="1.8"/>

    <!-- Fila 2 -->
    <circle cx="0" cy="60" r="1.8"/>
    <circle cx="60" cy="60" r="1.8"/>
    <circle cx="120" cy="60" r="1.8"/>
    <circle cx="180" cy="60" r="1.8"/>

    <!-- Fila 3 -->
    <circle cx="0" cy="120" r="1.8"/>
    <circle cx="60" cy="120" r="1.8"/>
    <circle cx="120" cy="120" r="1.8"/>
    <circle cx="180" cy="120" r="1.8"/>

    <!-- Fila 4 -->
    <circle cx="0" cy="180" r="1.8"/>
    <circle cx="60" cy="180" r="1.8"/>
    <circle cx="120" cy="180" r="1.8"/>
    <circle cx="180" cy="180" r="1.8"/>

  </g>

  <!-- Puntos centrales -->
  <g fill="#BFEEFF" opacity=".45">

    <!-- Centros -->
    <circle cx="30" cy="30" r=".6"/>
    <circle cx="90" cy="30" r=".6"/>
    <circle cx="150" cy="30" r=".6"/>

    <circle cx="30" cy="90" r=".6"/>
    <circle cx="90" cy="90" r=".6"/>
    <circle cx="150" cy="90" r=".6"/>

    <circle cx="30" cy="150" r=".6"/>
    <circle cx="90" cy="150" r=".6"/>
    <circle cx="150" cy="150" r=".6"/>

  </g>

  <!-- Puntos intermedios -->
  <g fill="#97DDF8" opacity=".35">

    <!-- Horizontales -->
    <circle cx="30" cy="0" r=".45"/>
    <circle cx="90" cy="0" r=".45"/>
    <circle cx="150" cy="0" r=".45"/>

    <circle cx="30" cy="60" r=".45"/>
    <circle cx="90" cy="60" r=".45"/>
    <circle cx="150" cy="60" r=".45"/>

    <circle cx="30" cy="120" r=".45"/>
    <circle cx="90" cy="120" r=".45"/>
    <circle cx="150" cy="120" r=".45"/>

    <circle cx="30" cy="180" r=".45"/>
    <circle cx="90" cy="180" r=".45"/>
    <circle cx="150" cy="180" r=".45"/>

    <!-- Verticales -->
    <circle cx="0" cy="30" r=".45"/>
    <circle cx="60" cy="30" r=".45"/>
    <circle cx="120" cy="30" r=".45"/>
    <circle cx="180" cy="30" r=".45"/>

    <circle cx="0" cy="90" r=".45"/>
    <circle cx="60" cy="90" r=".45"/>
    <circle cx="120" cy="90" r=".45"/>
    <circle cx="180" cy="90" r=".45"/>

    <circle cx="0" cy="150" r=".45"/>
    <circle cx="60" cy="150" r=".45"/>
    <circle cx="120" cy="150" r=".45"/>
    <circle cx="180" cy="150" r=".45"/>

  </g>

</svg>