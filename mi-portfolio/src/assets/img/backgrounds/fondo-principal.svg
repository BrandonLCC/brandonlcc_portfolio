<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#040816"/>
    <stop offset="100%" stop-color="#02040d"/>
  </linearGradient>

  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.4"/>
  </filter>

</defs>

<rect width="180" height="180" fill="url(#bg)"/>

<!-- GRID -->

<g stroke="#2d5da8" stroke-width="1" stroke-opacity=".22">

  <line x1="0" y1="0" x2="180" y2="0"/>
  <line x1="0" y1="60" x2="180" y2="60"/>
  <line x1="0" y1="120" x2="180" y2="120"/>
  <line x1="0" y1="180" x2="180" y2="180"/>

  <line x1="0" y1="0" x2="0" y2="180"/>
  <line x1="60" y1="0" x2="60" y2="180"/>
  <line x1="120" y1="0" x2="120" y2="180"/>
  <line x1="180" y1="0" x2="180" y2="180"/>

</g>

<!-- NODOS -->

<g>

  <!-- Glow -->
  <g fill="#4ca8ff" opacity=".18" filter="url(#glow)">
    <circle cx="60" cy="60" r="6"/>
    <circle cx="120" cy="60" r="6"/>
    <circle cx="60" cy="120" r="6"/>
    <circle cx="120" cy="120" r="6"/>
  </g>

  <!-- Punto principal -->
  <g fill="#72bcff">
    <circle cx="0" cy="0" r="1.7"/>
    <circle cx="60" cy="0" r="1.7"/>
    <circle cx="120" cy="0" r="1.7"/>
    <circle cx="180" cy="0" r="1.7"/>

    <circle cx="0" cy="60" r="1.7"/>
    <circle cx="60" cy="60" r="1.7"/>
    <circle cx="120" cy="60" r="1.7"/>
    <circle cx="180" cy="60" r="1.7"/>

    <circle cx="0" cy="120" r="1.7"/>
    <circle cx="60" cy="120" r="1.7"/>
    <circle cx="120" cy="120" r="1.7"/>
    <circle cx="180" cy="120" r="1.7"/>

    <circle cx="0" cy="180" r="1.7"/>
    <circle cx="60" cy="180" r="1.7"/>
    <circle cx="120" cy="180" r="1.7"/>
    <circle cx="180" cy="180" r="1.7"/>

    
    <circle cx="0" cy="180" r="1.7"/>
    <circle cx="60" cy="180" r="1.7"/>
    <circle cx="120" cy="180" r="1.7"/>
    <circle cx="180" cy="180" r="1.7"/>

    
    <circle cx="0" cy="180" r="1.7"/>
    <circle cx="60" cy="180" r="1.7"/>
    <circle cx="120" cy="180" r="1.7"/>
    <circle cx="180" cy="180" r="1.7"/>
  </g>

</g>

<!-- PUNTOS CENTRALES DE CADA CELDA -->

<g fill="#84c7ff" opacity=".28">

  <circle cx="30" cy="30" r=".45"/>
  <circle cx="90" cy="30" r=".45"/>
  <circle cx="150" cy="30" r=".45"/>

  <circle cx="30" cy="90" r=".45"/>
  <circle cx="90" cy="90" r=".45"/>
  <circle cx="150" cy="90" r=".45"/>

  <circle cx="30" cy="150" r=".45"/>
  <circle cx="90" cy="150" r=".45"/>
  <circle cx="150" cy="150" r=".45"/>

  

</g>

</svg>