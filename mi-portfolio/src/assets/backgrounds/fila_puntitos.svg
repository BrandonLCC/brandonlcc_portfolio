<svg width="500" height="60" viewBox="0 0 500 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glowDots" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="500" height="60" fill="#05010f"/>

  <g filter="url(#glowDots)" fill="#5eead4">
    <circle cx="20" cy="30" r="3.5" opacity="1"/>
    <circle cx="55" cy="30" r="3.5" opacity="0.9"/>
    <circle cx="90" cy="30" r="3.5" opacity="0.8"/>
    <circle cx="125" cy="30" r="3.5" opacity="0.7"/>
    <circle cx="160" cy="30" r="3.5" opacity="0.6"/>
    <circle cx="195" cy="30" r="3.5" opacity="0.5"/>
    <circle cx="230" cy="30" r="3.5" opacity="0.4"/>
    <circle cx="265" cy="30" r="3.5" opacity="0.3"/>
    <circle cx="300" cy="30" r="3.5" opacity="0.2"/>
    <circle cx="335" cy="30" r="3" opacity="0.15"/>
    <circle cx="370" cy="30" r="2.5" opacity="0.1"/>
  </g>
</svg>
