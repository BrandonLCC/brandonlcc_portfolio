<svg
    width="1920"
    height="1080"
    viewBox="0 0 1920 1080"
    xmlns="http://www.w3.org/2000/svg"
>

    <defs>

        <!-- Animaciones de estrellas -->

        <style>
            .star {
                animation: twinkle 3s ease-in-out infinite;
            }

            .s1 {
                animation-duration: 2.4s;
            }

            .s2 {
                animation-duration: 3.7s;
            }

            .s3 {
                animation-duration: 4.5s;
            }

            @keyframes twinkle {
                0%, 100% {
                    opacity: 0.25;
                }

                50% {
                    opacity: 1;
                }
            }
        </style>

    </defs>


    <!-- ========================================= -->
    <!-- MAGENTA -->
    <!-- ========================================= -->

