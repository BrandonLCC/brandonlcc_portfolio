<svg
    width="1024"
    height="1024"
    viewBox="0 0 1024 1024"
    xmlns="http://www.w3.org/2000/svg"
>

<defs>

    <!-- Gradiente principal -->
    <linearGradient id="portalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#92c9ff"/>
        <stop offset="45%" stop-color="#92c9ff"/>
        <stop offset="75%" stop-color="#92c9ff"/>
        <stop offset="100%" stop-color="#ffff"/>
    </linearGradient>

    <!-- Gradiente inverso -->
    <linearGradient id="portalGradientReverse" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#92c9ff"/>
        <stop offset="50%" stop-color="#92c9ff"/>
        <stop offset="100%" stop-color="#ffff"/>
    </linearGradient>

    <!-- Gradiente puntos -->
    <linearGradient id="portalDots" x1="0%" y1="0%" x2="100%" y2="100%">
         <stop offset="0%" stop-color="#92c9ff"/>
        <stop offset="50%" stop-color="#92c9ff"/>
        <stop offset="100%" stop-color="#ffff"/>
    </linearGradient>

    <!-- Glow suave -->
    <filter id="portalBlur">
        <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Glow fuerte -->
    <filter id="portalStrongGlow">
        <feGaussianBlur stdDeviation="18"/>
    </filter>

</defs>


<g transform="translate(512,512)">

    <!-- ========================================= -->
    <!-- ANILLOS EXTERNOS                         -->
    <!-- ========================================= -->

    <circle
        r="280"
        fill="none"
        stroke="url(#portalDots)"
        stroke-width="2.5"
        stroke-dasharray="2 12"
        opacity="0.5"
    />

    <circle
        r="255"
        fill="none"
        stroke="url(#portalDots)"
        stroke-width="1.5"
        stroke-dasharray="1 8"
        opacity="0.9"
    />


    <!-- ========================================= -->
    <!-- GLOW EXTERIOR                            -->
    <!-- ========================================= -->

    <circle
        r="230"
        fill="none"
        stroke="url(#portalGradient)"
        stroke-width="30"
        opacity="0.0"
        filter="url(#portalStrongGlow)"
    />

    <circle
        r="230"
        fill="none"
        stroke="url(#portalGradient)"
        stroke-width="25"
        opacity="0.0"
        filter="url(#portalBlur)"
    />


    <!-- ========================================= -->
    <!-- ANILLO PRINCIPAL                         -->
    <!-- ========================================= -->

    <circle
        r="230"
        fill="none"
        stroke="url(#portalGradientReverse)"
        stroke-width="8.5"
    />


    <!-- Micro detalles -->
    <circle
        r="230"
        fill="none"
        stroke="#ffffff"
        stroke-width="0.5"
        stroke-dasharray="1 22"
        opacity="0.7"
    />


    <!-- ========================================= -->
    <!-- CONEXIONES                               -->
    <!-- ========================================= -->

    <g
        fill="none"
        stroke-linecap="round"
    >

        <!-- ===================================== -->
        <!-- CIAN PRINCIPAL                         -->
        <!-- ===================================== -->

        <g
            stroke="#00ffff"
            stroke-width="1.8"
            opacity="0.95"
        >

            <!-- Superior -->
            <path
                d="M -45 -225.562
                   A 230 230 0 0 1 45 -225.562"
            />

            <!-- Izquierda -->
            <path
                d="M -225.562 -45
                   A 230 230 0 0 0 -225.562 45"
            />

            <!-- Derecha -->
            <path
                d="M 225.562 -45
                   A 230 230 0 0 1 225.562 45"
            />

            <!-- Inferior -->
            <path
                d="M -45 225.562
                   A 230 230 0 0 0 45 225.562"
            />

        </g>


        <!-- ===================================== -->
        <!-- MAGENTA SECUNDARIO                    -->
        <!-- ===================================== -->

        <g
            stroke="#ff00ff"
            stroke-width="0.9"
            opacity="0.85"
        >

            <!-- Superior -->
            <path
                d="M -60 -222.048
                   A 230 230 0 0 1 60 -222.048"
            />

            <!-- Izquierda -->
            <path
                d="M -222.048 -60
                   A 230 230 0 0 0 -222.048 60"
            />

            <!-- Derecha -->
            <path
                d="M 222.048 -60
                   A 230 230 0 0 1 222.048 60"
            />

            <!-- Inferior -->
            <path
                d="M -60 222.048
                   A 230 230 0 0 0 60 222.048"
            />

        </g>


        <!-- ===================================== -->
        <!-- MORADO DETALLE                        -->
        <!-- ===================================== -->

        <g
            stroke="#6200ff"
            stroke-width="0.5"
            opacity="0.9"
        >

            <!-- Superior -->
            <path
                d="M -72 -218.433
                   A 230 230 0 0 1 72 -218.433"
            />

            <!-- Izquierda -->
            <path
                d="M -218.433 -72
                   A 230 230 0 0 0 -218.433 72"
            />

            <!-- Derecha -->
            <path
                d="M 218.433 -72
                   A 230 230 0 0 1 218.433 72"
            />

            <!-- Inferior -->
            <path
                d="M -72 218.433
                   A 230 230 0 0 0 72 218.433"
            />

        </g>

    </g>


    <!-- ========================================= -->
    <!-- PUNTOS DE CONEXIÓN                       -->
    <!-- ========================================= -->

    <g>

        <circle
            cx="0"
            cy="-230"
            r="2.5"
            fill="#00ffff"
        />

        <circle
            cx="230"
            cy="0"
            r="2.5"
            fill="#ff00ff"
        />

        <circle
            cx="0"
            cy="230"
            r="2.5"
            fill="#6200ff"
        />

        <circle
            cx="-230"
            cy="0"
            r="2.5"
            fill="#00ffff"
        />

    </g>


    <!-- ========================================= -->
    <!-- LÍNEA FINAL DE PRECISIÓN                 -->
    <!-- ========================================= -->

    <circle
        r="230"
        fill="none"
        stroke="#00ffff"
        stroke-width="0.4"
        opacity="0.7"
    />

</g>

</svg>