<svg width="380" height="520" viewBox="0 0 520 520" fill="none"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Sombra interna azul -->
<filter id="innerGlow">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feComposite in="blur" operator="in" in2="SourceGraphic"/>
</filter>

<!-- Glow suave -->
<filter id="softGlow">
<feGaussianBlur stdDeviation="4"/>
</filter>

<linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#1E63FF"/>
<stop offset="0.5" stop-color="#00BFFF"/>
<stop offset="1" stop-color="#162B66"/>
</linearGradient>

</defs>


<!-- marco exterior oscuro -->
<rect
x="35"
y="35"
width="450"
height="450"
rx="16"
stroke="#12315B"
stroke-width="2"
opacity="0.8"
/>


<!-- brillo exterior -->
<rect
x="38"
y="38"
width="444"
height="444"
rx="14"
stroke="#008CFF"
stroke-width="1"
opacity="0.45"
filter="url(#softGlow)"
/>


<!-- borde principal -->
<rect
x="45"
y="45"
width="430"
height="430"
rx="12"
stroke="url(#borderGradient)"
stroke-width="1.5"
/>


<!-- sombra interna -->
<rect
x="48"
y="48"
width="424"
height="424"
rx="11"
stroke="#0077FF"
stroke-width="8"
opacity="0.15"
filter="url(#innerGlow)"
/>



<!-- esquina superior izquierda -->
<path
d="M35 90V50C35 42 42 35 50 35H100"
stroke="#2A8CFF"
stroke-width="2"
opacity="0.7"
/>


<!-- esquina superior derecha extendida -->
<path
d="M420 35H470C480 35 485 42 485 52V110"
stroke="#146EFF"
stroke-width="2"
/>


<!-- esquina inferior izquierda -->
<path
d="M35 410V470C35 480 42 485 52 485H120"
stroke="#164B9A"
stroke-width="2"
/>


<!-- pequeños puntos tecnológicos -->
<circle cx="25" cy="200" r="1" fill="#00AFFF"/>
<circle cx="25" cy="220" r="1" fill="#00AFFF"/>
<circle cx="25" cy="240" r="1" fill="#00AFFF"/>

</svg>